<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LineUp Admin</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --text:#16202a; --muted:#66727f; --line:#e3e7ec;
    --brand:#0f5c4d; --brand-ink:#fff; --danger:#c0392b; --ok:#1e8e5a; --warn:#b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10161c; --card:#18212a; --text:#e8edf2; --muted:#93a1ae; --line:#26323d; --brand:#2fb592; --brand-ink:#05231b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; margin-right:auto; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { background:none; border:0; padding:8px 12px; border-radius:8px; color:var(--muted); font:inherit; cursor:pointer; }
  nav button.on { background:var(--brand); color:var(--brand-ink); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat b { display:block; font-size:24px; }
  .stat span { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  tr.click { cursor:pointer; } tr.click:hover { background:rgba(127,127,127,.08); }
  .wrap { overflow-x:auto; }
  input,select,textarea { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); max-width:100%; }
  textarea { width:100%; }
  button.btn { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
  button.danger { color:var(--danger); border-color:var(--danger); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:600; border:1px solid var(--line); }
  .pill.active { color:var(--ok); } .pill.suspended { color:var(--danger); } .pill.pending { color:var(--warn); }
  .muted { color:var(--muted); } .err { color:var(--danger); }
  h2 { font-size:16px; margin:0 0 12px; } h3 { font-size:14px; margin:16px 0 6px; }
  #login { max-width:380px; margin:20vh auto; text-align:center; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px; display:none; z-index:20; max-width:90vw; }
  .hidden { display:none !important; }
  .card.stat.click { cursor:pointer; transition:transform .1s, border-color .1s; }
  .card.stat.click:hover, .card.stat.click:focus-visible { border-color:var(--brand); transform:translateY(-1px); outline:none; }
</style>
</head>
<body>
<div id="login" class="card">
  <h2>LineUp Admin</h2>
  <p class="muted">Admin sign-in</p>
  <form id="loginForm" style="display:grid;gap:10px;text-align:left">
    <input id="email" type="email" placeholder="Admin email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary" id="signin" type="submit">Sign in</button>
  </form>
  <p class="err" id="loginErr"></p>
</div>
<div id="app" class="hidden">
  <header>
    <h1>LineUp Admin</h1>
    <nav id="nav"></nav>
    <span class="muted" id="who"></span>
    <button class="btn" id="signout">Sign out</button>
  </header>
  <main id="view"></main>
</div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
